name: release
# Manual: publishes the Windows files built by a CI run as a GitHub pre-release.
# It re-verifies SHA256SUMS.txt before publishing. It does not build or change anything else.
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "CI run id holding the RaceEngineerAI-windows artifact", required: true }
      tag: { description: "Release tag", required: true, default: "v0.6.7-rc1" }
      commit: { description: "Commit the run was built from", required: true }
      stable: { description: "true = STABLE release (plain tag such as v0.7.0): the ONLY kind the in-app updater offers. false = pre-release for testing (e.g. v0.7.0-rc1)", type: boolean, default: false }
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download CI artifact
        run: gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" -n RaceEngineerAI-windows -D dist
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS.txt && ls -l
      - name: Create pre-release
        run: |
          cd dist
          cat > notes.md <<NOTES
          Build Windows prodotta dalla CI (run ${{ inputs.run_id }}, commit ${{ inputs.commit }}). Checksum verificati prima della pubblicazione.

          **Stato di verifica:** testata in CI su Windows con dati SINTETICI. NON ancora verificata con Le Mans Ultimate reale.

          - RaceEngineerAI-win32.zip: versione portatile, estrai e avvia RaceEngineerAI.exe
          - RaceEngineerAI-Setup-*.exe: installer
          - SHA256SUMS.txt

          $(cat SIGNING.txt 2>/dev/null || echo "Eseguibili NON firmati: Windows SmartScreen puo mostrare un avviso.")
          Procedura di test: docs/UNIFIED_DRIVING_DISPLAY.md sezione 11.2.
          NOTES
          if [ "${{ inputs.stable }}" = "true" ]; then
            echo "${{ inputs.tag }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "A stable tag must look like v1.2.3"; exit 1; }
            KIND="--latest"; TITLE="${{ inputs.tag }}"
          else
            KIND="--prerelease"; TITLE="${{ inputs.tag }} (Windows, test con LMU)"
          fi
          # SHA256SUMS.txt and RaceEngineerAI-win32.zip are what the in-app updater verifies: both must be assets of the release
          gh release create "${{ inputs.tag }}" --repo "${{ github.repository }}" --target "${{ inputs.commit }}" $KIND \
            --title "$TITLE" --notes-file notes.md \
            RaceEngineerAI-win32.zip RaceEngineerAI-Setup-*.exe SHA256SUMS.txt
