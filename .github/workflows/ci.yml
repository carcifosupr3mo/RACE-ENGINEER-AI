name: ci
on: [push, pull_request, workflow_dispatch]   # workflow_dispatch: manual build (e.g. when a push run is lost in a GitHub outage)
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e "backend[dev]"
      - run: python -m pytest tests
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && npm run build && npm test
        working-directory: frontend
  display-e2e:          # Driving Display in Chromium against a backend serving SYNTHETIC data (updates, map, interaction, coherence, offline/reconnect, 4 viewports)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e "backend[dev]"
      - run: npm ci && npm run build && npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: start synthetic backend (faster than real time) and run the display e2e
        working-directory: frontend
        run: |
          mkdir -p "$RUNNER_TEMP/red" && export RACE_ENGINEER_DATA="$RUNNER_TEMP/red"
          python -m race_engineer serve --synthetic persistent --laps 12 --synthetic-speed 6 --port 8790 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8790/api/health && break; sleep 1; done
          node e2e/display.cjs http://127.0.0.1:8790 "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: display-screenshots, path: "${{ runner.temp }}/shots" }
  windows-procedure:    # PowerShell verification procedure, tested on real Windows PowerShell 5.1 and PowerShell 7 WITHOUT LMU (synthetic fixtures)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e "backend[dev]"
      - name: Test-Procedura.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\windows\tests\Test-Procedura.ps1
      - name: Test-Procedura.ps1 (PowerShell 7)
        shell: pwsh
        run: .\scripts\windows\tests\Test-Procedura.ps1
  windows-bundle:       # the only place a Windows .exe can be produced AND smoke-tested on a real Windows machine (without LMU)
    runs-on: windows-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e "backend[dev]" PySide6 PySide6-WebEngine pyinstaller
      - name: Build bundle (+ signing when a certificate is configured, + smoke test of the frozen exe, + installer, + SHA256)
        run: python scripts/build.py --skip-tests --smoke --installer
        env:      # code-signing certificate (repository secrets). Empty = unsigned build, stated in the log and in SIGNING.txt. See docs/CODE-SIGNING.md
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
      - name: Signing pipeline self-test (throw-away certificate, on copies only - nothing that ships is touched)
        run: python scripts/test_signing_windows.py dist\RaceEngineerAI
      - name: Installer on real Windows - install, smoke-test the INSTALLED copy, clean quit, upgrade and uninstall over a RUNNING copy
        shell: pwsh
        run: .\scripts\windows\tests\Test-Installer.ps1 -Setup (Get-ChildItem dist\RaceEngineerAI-Setup-*.exe | Select-Object -First 1).FullName -Dir "$env:RUNNER_TEMP\REAI"
      - uses: actions/upload-artifact@v4
        with:
          name: RaceEngineerAI-windows
          path: |
            dist/RaceEngineerAI-win32.zip
            dist/RaceEngineerAI-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/SIGNING.txt
      - name: PowerShell procedure against the FROZEN exe (no LMU, synthetic fixtures)
        if: always()
        shell: pwsh
        run: |
          .\scripts\windows\tests\Test-Procedura.ps1 -CliPath "dist\RaceEngineerAI\race-engineer-cli.exe"
