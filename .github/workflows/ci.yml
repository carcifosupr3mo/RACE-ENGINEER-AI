name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e "backend[dev]"
      - run: python -m pytest tests
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && npm run build && npm test
        working-directory: frontend
  windows-bundle:       # the only place a Windows .exe can be produced
    runs-on: windows-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e "backend[dev]" PySide6 PySide6-WebEngine pyinstaller
      - run: python scripts/build.py --skip-tests
      - uses: actions/upload-artifact@v4
        with: { name: RaceEngineerAI-windows, path: dist/RaceEngineerAI-win32.zip }
