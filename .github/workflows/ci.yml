name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e "backend[dev]"
      - run: python -m pytest tests
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && npm run build && npm test
        working-directory: frontend
  windows-procedure:    # PowerShell verification procedure, tested on real Windows PowerShell 5.1 and PowerShell 7 WITHOUT LMU (synthetic fixtures)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e "backend[dev]"
      - name: Test-Procedura.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\windows\tests\Test-Procedura.ps1
      - name: Test-Procedura.ps1 (PowerShell 7)
        shell: pwsh
        run: .\scripts\windows\tests\Test-Procedura.ps1
  windows-bundle:       # the only place a Windows .exe can be produced AND smoke-tested on a real Windows machine (without LMU)
    runs-on: windows-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e "backend[dev]" PySide6 PySide6-WebEngine pyinstaller
      - name: Build bundle (+ smoke test of the frozen exe, + installer, + SHA256)
        run: python scripts/build.py --skip-tests --smoke --installer
      - name: Install silently, smoke-test the INSTALLED copy, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\RaceEngineerAI-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$env:RUNNER_TEMP\REAI" -Wait
          python scripts/smoke_bundle.py "$env:RUNNER_TEMP\REAI"
          Start-Process "$env:RUNNER_TEMP\REAI\unins000.exe" -ArgumentList "/VERYSILENT" -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: RaceEngineerAI-windows
          path: |
            dist/RaceEngineerAI-win32.zip
            dist/RaceEngineerAI-Setup-*.exe
            dist/SHA256SUMS.txt
      - name: PowerShell procedure against the FROZEN exe (no LMU, synthetic fixtures)
        if: always()
        shell: pwsh
        run: |
          .\scripts\windows\tests\Test-Procedura.ps1 -CliPath "dist\RaceEngineerAI\race-engineer-cli.exe"
